excluded:
  - build
  - .build

disabled_rules:
  - trailing_whitespace
  - vertical_whitespace
  - opening_brace
  - colon
  - mark
  - void_return
  - redundant_void_return
  - implicit_getter
  - no_space_in_method_call
  - empty_parentheses_with_trailing_closure
  - implicit_optional_initialization
  - attribute_name_spacing
  - large_tuple
  - optional_data_string_conversion
  - nesting

line_length:
  warning: 200
  error: 250

identifier_name:
  min_length: 2

type_name:
  min_length: 2
